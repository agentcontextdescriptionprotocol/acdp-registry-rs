[registry]
authority = "localhost"
port      = 8443
bind      = "0.0.0.0"
# Binding a non-loopback interface with in-process TLS disabled is a deliberate
# choice here: the container runs behind a proxy/edge that terminates TLS (see
# RAILWAY.md). Without this opt-in the server refuses to start on 0.0.0.0.
allow_public_bind = true
profiles  = ["acdp-registry-core", "acdp-registry-discovery"]
cross_registry_resolution = true

[registry.tls]
enabled = false

[registry.cors]
allowed_origins = []

[storage]
backend         = "postgres"
max_connections = 20
# postgres_url comes from ACDP_REGISTRY_STORAGE__POSTGRES_URL

[auth]
enabled              = false
did_methods          = ["did:web"]
token_ttl_seconds    = 3600
challenge_ttl_seconds = 300
token_leeway_seconds = 30
anonymous_public_reads = true
# jwt_secret = "<base64 ≥32-byte secret>"

[webhook]
enabled        = false
queue_capacity = 1024

[limits]
max_payload_bytes           = 1048576
max_embedded_bytes          = 65536
idempotency_key_ttl_seconds = 86400

# FEAT-06: per-IP + process-global rate limiting on /auth/*. On by default.
# Behind a reverse proxy, set trusted_proxies to the proxy CIDR so the client
# IP is read from X-Forwarded-For (never trusted otherwise). See CONFIGURATION.md.
[rate_limit]
enabled           = true
per_ip_per_minute = 60
global_per_minute = 6000
trusted_proxies   = []

# FEAT-10: Prometheus /metrics. Off by default; enable to expose request +
# domain metrics for scraping. Optionally gate with a bearer_token.
[metrics]
enabled = false

[playground]
enabled = false

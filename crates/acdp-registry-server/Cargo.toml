[package]
name        = "acdp-registry-server"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "ACDP registry HTTP server binary"

[lints]
workspace = true

[[bin]]
name = "acdp-registry"
path = "src/main.rs"

[dependencies]
acdp                  = { workspace = true }
acdp-registry-auth    = { path = "../acdp-registry-auth",    version = "0.1.0" }
acdp-registry-core    = { path = "../acdp-registry-core",    version = "0.1.0" }
acdp-registry-pg      = { path = "../acdp-registry-pg",      version = "0.1.0", optional = true }
acdp-registry-sqlite  = { path = "../acdp-registry-sqlite",  version = "0.1.0", optional = true }
acdp-registry-store   = { path = "../acdp-registry-store",   version = "0.1.0" }
acdp-registry-types   = { path = "../acdp-registry-types",   version = "0.1.0" }
acdp-registry-webhook = { path = "../acdp-registry-webhook", version = "0.1.0" }
anyhow             = { workspace = true }
async-trait        = { workspace = true }
axum               = { workspace = true }
axum-server        = { workspace = true }
base64             = { workspace = true }
chrono             = { workspace = true }
dotenvy            = { workspace = true }
rand               = { workspace = true }
tokio              = { workspace = true }
tower              = { workspace = true }
tower-http         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default        = ["storage-sqlite"]
storage-pg     = ["dep:acdp-registry-pg"]
storage-sqlite = ["dep:acdp-registry-sqlite"]
storage-memory = []
playground     = ["acdp-registry-core/playground"]

[dev-dependencies]
http-body-util = "0.1"
serde          = { workspace = true }
serde_json     = { workspace = true }
sqlx           = { workspace = true }
tempfile       = "3"
ed25519-dalek  = "3.0"
uuid           = { workspace = true }
# Serialize PG integration tests so they don't fight over the shared
# truncate-and-test database. SQLite tests use disposable tempfiles so
# they don't need this.
serial_test    = "4"

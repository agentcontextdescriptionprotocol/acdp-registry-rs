[package]
name        = "acdp-registry-webhook"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "HMAC-signed webhook emitter for acdp-registry-rs"

[lints]
workspace = true

[dependencies]
acdp                = { workspace = true }
acdp-registry-types = { path = "../acdp-registry-types", version = "0.1.0", default-features = false }
chrono     = { workspace = true }
hex        = { workspace = true }
hmac       = { workspace = true }
reqwest    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
thiserror  = { workspace = true }
tokio      = { workspace = true }
tracing    = { workspace = true }
uuid       = { workspace = true }

[dev-dependencies]
# `SsrfPolicy::allow_test_loopback()` is deprecated unless the
# `test-transport` feature is on; tests use it to hit 127.0.0.1 servers.
acdp = { workspace = true, features = ["test-transport"] }

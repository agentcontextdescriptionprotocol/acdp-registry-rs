name: release-plz

on:
  push:
    branches:
      - main

permissions:
  pull-requests: write
  contents: write

jobs:
  release-plz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: acdp-registry-rs
      - uses: actions/checkout@v4
        with:
          repository: agentcontextdescriptionprotocol/acdp-rs
          path: acdp-rs
      - uses: dtolnay/rust-toolchain@stable
      - name: release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          manifest_path: acdp-registry-rs/Cargo.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

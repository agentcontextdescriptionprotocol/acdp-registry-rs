name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Superseded pushes to the same PR cancel their in-flight run; pushes to
# main always run to completion so the cache and badge stay trustworthy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: clippy (sqlite default)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (postgres)
        run: |
          cargo clippy -p acdp-registry-server \
            --no-default-features --features storage-pg \
            --all-targets -- -D warnings
      - name: clippy (playground)
        run: |
          cargo clippy -p acdp-registry-server \
            --features storage-sqlite,playground \
            --all-targets -- -D warnings
      - name: clippy (memory)
        run: |
          cargo clippy -p acdp-registry-server \
            --no-default-features --features storage-memory \
            --all-targets -- -D warnings

  # The workspace declares rust-version = 1.88; make that claim enforceable
  # instead of aspirational. Checks both shipped storage backends.
  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo check (sqlite default)
        run: cargo check --workspace --all-targets
      - name: cargo check (postgres)
        run: |
          cargo check -p acdp-registry-server \
            --no-default-features --features storage-pg \
            --all-targets

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo doc
        run: cargo doc --workspace --no-deps

  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acdp
          POSTGRES_PASSWORD: acdp
          POSTGRES_DB: acdp_registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acdp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo test (sqlite)
        run: cargo test --workspace
      - name: cargo test (playground)
        run: |
          cargo test -p acdp-registry-server \
            --features storage-sqlite,playground
      - name: cargo test (postgres)
        env:
          ACDP_REGISTRY_TEST_PG_URL: postgres://acdp:acdp@localhost:5432/acdp_registry
        run: |
          cargo test -p acdp-registry-pg
          cargo test -p acdp-registry-server \
            --no-default-features --features storage-pg \
            --test pg_integration
      - name: cargo test (memory)
        run: |
          cargo test -p acdp-registry-server \
            --no-default-features --features storage-memory

  # Runs the spec conformance suite against a SHA-pinned spec checkout.
  # ACDP_REQUIRE_CONFORMANCE turns a missing spec into a hard failure, so
  # a green run genuinely proves the fixtures executed rather than that
  # the suite silently skipped them (REG-1). It does not, on its own,
  # catch ACDP_SPEC_DIR pointing at the wrong subdirectory of a real
  # checkout -- see the KNOWN_FAMILIES/EXCUSED ratchet tests in
  # tests/conformance.rs, which is why ACDP_SPEC_DIR below is the spec
  # *root* (where registries/profiles.json lives), not schemas/conformance.
  conformance:
    name: conformance (spec fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out the ACDP spec
        uses: actions/checkout@v4
        with:
          repository: agentcontextdistributionprotocol/agentcontextdistributionprotocol
          # Pinned so a spec-repo push cannot change this repo's CI result
          # without a commit here. Bump deliberately when adopting new
          # fixtures.
          ref: d3a34134ea6471aac2622ccaf8c7c7063d8888c5
          path: acdp-spec
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Conformance (spec fixtures required)
        env:
          ACDP_SPEC_DIR: ${{ github.workspace }}/acdp-spec
          ACDP_REQUIRE_CONFORMANCE: "1"
        run: |
          cargo test -p acdp-registry-server \
            --features storage-sqlite,playground \
            --test conformance --test conformance_gate -- --nocapture

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acdp
          POSTGRES_PASSWORD: acdp
          POSTGRES_DB: acdp_registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acdp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-llvm-cov
      - name: cargo llvm-cov
        env:
          ACDP_REGISTRY_TEST_PG_URL: postgres://acdp:acdp@localhost:5432/acdp_registry
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: coverage summary
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  audit:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --workspace

# acdp-registry-rs configuration example.
#
# Load with: ACDP_REGISTRY_CONFIG=./config/registry.example.toml acdp-registry
# or set the same fields via env vars: ACDP_REGISTRY_<SECTION>__<FIELD>.

[registry]
# Bare DNS hostname. Used to mint `ctx_id` and as the `did:web` registry id.
authority = "registry.example.com"
# Public base URL advertised to downstream consumers (the control plane uses
# it to route federation proxy calls). When omitted, derived as
# `https://{authority}`. Set explicitly behind a non-default port/path.
# base_url = "https://registry.example.com"
# TCP port to listen on.
port      = 8443
# Bind address. 0.0.0.0 accepts traffic on every interface.
bind      = "0.0.0.0"
# Profiles advertised in the capabilities document.
profiles  = ["acdp-registry-core", "acdp-registry-discovery"]
# When false, ctx_ids whose authority differs from `authority` return 404
# instead of being resolved against the foreign registry.
cross_registry_resolution = true

[registry.tls]
enabled   = false
# cert_path = "/etc/acdp/tls/cert.pem"
# key_path  = "/etc/acdp/tls/key.pem"

[registry.cors]
# Empty (default) disables CORS — browsers cannot make authenticated
# cross-origin requests using a visitor's stored bearer token. Add your
# UI's origin explicitly to opt in.
allowed_origins = []

[storage]
# "postgres" (production), "sqlite" (dev), or "memory" (compile-time only).
backend         = "sqlite"
sqlite_path     = "./data/registry.db"
# postgres_url  = "postgres://acdp:acdp@localhost:5432/acdp_registry"
max_connections = 20

[auth]
enabled              = true
# DID methods accepted from publishing producers, advertised as
# `supported_did_methods`. `did:web` is mandatory; add `did:key` to accept
# self-certifying did:key producers (ACDP 0.2.0, workstream C) — their
# signatures verify offline from the DID itself, no document fetch:
#   did_methods = ["did:web", "did:key"]
did_methods          = ["did:web"]
# Base64-encoded ≥32-byte random secret. Generate with:
#   openssl rand -base64 32
# Override per environment via ACDP_REGISTRY_AUTH__JWT_SECRET.
# The startup-time validator refuses to launch with the literal `changeme`,
# and (with auth enabled + HS256) refuses an EMPTY secret unless
# allow_ephemeral_secret = true below.
jwt_secret           = ""
# Local dev only: boot with a random process-lifetime HS256 key when
# jwt_secret is empty. Tokens won't survive a restart. MUST stay false in
# production — set a real jwt_secret instead.
allow_ephemeral_secret = false
token_ttl_seconds    = 3600
challenge_ttl_seconds = 300
# Clock-skew leeway applied to JWT exp validation.
token_leeway_seconds = 30
# CLAUDE.md: anonymous reads are off by default. Opt in explicitly when
# the registry hosts world-readable public contexts (developer registries,
# discovery hubs).
anonymous_public_reads = true
# Enforce tenant scoping on every authenticated request. Default false keeps
# V0 behavior (a request that asserts no tenant runs with the tenant filter
# disabled, gated only by visibility). Set true on a multi-tenant deployment:
# a request that resolves to no tenant is rejected (403 not_authorized), and an
# authenticated caller's tenant is taken ONLY from the JWT `tenant` claim, so
# an unbound token can't assert a tenant via the X-Tenant-Id header.
require_tenant = false
# Bearer tokens accepted by every /admin/* route (require_admin_bearer).
# Empty (the default) disables all /admin/* routes, including
# GET /admin/contexts (playground feature) — there is no working admin
# surface without at least one token configured here.
# admin_tokens = ["<generate out of band>"]

[webhook]
enabled         = false
# url            = "https://example.com/hooks/acdp"
# secret         = "<random shared secret — MUST be non-empty if enabled>"
timeout_seconds = 5
max_retries     = 3
# Bounded in-memory queue; events are dropped (with a warn log) when full.
queue_capacity  = 1024

[limits]
# Maximum publish-body size accepted by /contexts (enforced by the body-
# limit layer applied to every route).
max_payload_bytes  = 1048576
# Maximum size of an inline data_ref `value`.
max_embedded_bytes = 65536
# TTL advertised to producers for Idempotency-Key replay (seconds).
idempotency_key_ttl_seconds = 86400
# Max POST /contexts per minute per signing agent_id (RFC-ACDP-0008 §4.3).
# 0 disables. In-memory + per-process; front multi-replica deployments with a
# shared limiter for a global bound.
publish_rate_per_minute = 60
# Max POST /auth/challenge per minute per requested agent_id. The challenge
# endpoint is unauthenticated, so this bounds flooding that would amplify
# nonce-store writes. 0 disables. Same in-memory + per-process caveat.
challenge_rate_per_minute = 60

[rate_limit]
# FEAT-06: per-IP and process-global rate limiting on the /auth/* endpoints
# (token issuance / refresh / revoke). These bounds are attacker-independent,
# unlike the per-agent [limits] budgets above (agent_id is caller-controlled
# and an attacker can rotate it).
#
# Master switch. Default true — /auth/* is the most attacker-controllable
# surface, so the bound is protective out of the box. Set false to fall back
# to the per-agent [limits] budgets only.
enabled = true
# Max /auth/* requests per minute per resolved client IP. 0 disables the
# per-IP bound (the global ceiling still applies).
per_ip_per_minute = 60
# Whole-process ceiling across ALL client IPs per minute. Defends a single
# replica against a source-IP-rotating flood. 0 disables it.
global_per_minute = 6000
# SECURITY — reverse-proxy trust. X-Forwarded-For is caller-supplied and is
# IGNORED unless the TCP socket peer is in one of these CIDRs; then the client
# IP is taken from the rightmost XFF entry that is not itself a trusted proxy.
# Empty (default) = never trust XFF, always use the socket peer. List ONLY the
# addresses of proxies you operate — a wrong entry lets clients spoof their IP.
#   trusted_proxies = ["10.0.0.0/8"]
trusted_proxies = []

[metrics]
# FEAT-10: Prometheus /metrics endpoint (text exposition, version 0.0.4).
# Off by default. When enabled, GET /metrics is mounted (outside the ACDP auth
# pipeline and the rate limiter, so a scraper reaches it unimpeded) and the
# registry records HTTP request metrics + domain counters (publishes, receipts
# minted, lifecycle events, log leaves, witness cosignatures, rate-limit
# rejections).
enabled = false
# When set, /metrics requires `Authorization: Bearer <token>`. Empty leaves it
# open — appropriate only when reachable from a trusted scrape network.
# bearer_token = ""
# Histogram buckets (seconds) for acdp_registry_request_duration_seconds.
# duration_buckets = [0.001, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0]

[playground]
# When true, the publish handler skips DID-signature verification. NEVER
# enable in production — the registry will accept any forged signature.
# Incompatible with [receipt]: a receipts-advertising registry has no
# unverified publish path (RFC-ACDP-0010 §7), so startup refuses the combo.
enabled = false

[receipt]
# Registry-receipt signing identity (RFC-ACDP-0010, ACDP 0.2.0). When a
# signing key is configured the registry mints a signed receipt for every
# publish (persisted atomically with the context row) and advertises
# acdp_version 0.2.0 + the `acdp-registry-receipts` profile. Leave unset to
# stay a 0.1.0 receipt-less registry.
#
# Exactly one key source. Generate a seed with: openssl rand -base64 32
# Env override: ACDP_REGISTRY_RECEIPT__SIGNING_KEY_SEED_B64.
# signing_key_seed_b64 = ""
# ...or a mounted secret file whose contents are that base64 string:
# signing_key_path = "/etc/acdp/receipt-key.seed"
#
# Fragment under the registry DID; receipts carry
# `signature.key_id = "did:web:<authority>#<fragment>"`. Pick a FRESH
# fragment on every rotation.
key_id_fragment = "receipt-key-1"

# Lineage-head receipts (RFC-ACDP-0011, ACDP 0.3.0): mint a registry-signed
# head attestation on every GET /lineages/{id}/current response, signed with
# the SAME receipt key (no new key role). Requires a signing key above;
# advertises `acdp-registry-head-receipts` and acdp_version 0.3.0.
# head_receipts = false

# Rotated-out receipt verification keys. RFC-ACDP-0010 §9: these stay in the
# DID document's verificationMethod indefinitely (removed from
# assertionMethod only). Dropping an entry bricks every receipt that key
# signed — remove ONLY on confirmed compromise.
# [[receipt.retired_keys]]
# public_key_b64  = "<base64 of the raw 32-byte Ed25519 public key>"
# key_id_fragment = "receipt-key-0"

[lifecycle]
# Lifecycle events & retraction (RFC-ACDP-0013, ACDP 0.3.0). When true the
# registry serves POST /contexts/{ctx_id}/retract and /republish
# (producer-signed events, verified like a publish), derives status with the
# retracted > superseded > expired > active precedence, excludes retracted
# contexts from default search and /current, and advertises
# `acdp-registry-lifecycle` + acdp_version 0.3.0. Retraction is
# mark-not-delete: bodies stay retrievable forever.
enabled = false

[log]
# Registry transparency log (RFC-ACDP-0012, ACDP 0.3.0): a per-registry,
# append-only RFC 6962-style Merkle tree over publish events. When true the
# registry appends one leaf per accepted publish ATOMICALLY with the context
# row and its receipt (no degraded mode — a publish that cannot append its
# leaf fails), serves GET /log/checkpoint, /log/proof, and /log/entries,
# signs checkpoints with the [receipt] key (no new key role), and advertises
# `acdp-registry-transparency-log` + acdp_version 0.3.0.
#
# Prerequisites: a configured [receipt] signing key and a durable storage
# backend (sqlite or postgres) — both enforced at startup.
enabled = false

# The <instance> component of the log identifier
# log_id = "did:web:<authority>/log/<instance>" (matches [a-z0-9-]{1,32}).
# A registry operates exactly ONE live instantiation. Change this ONLY on
# catastrophic tree loss (RFC-ACDP-0012 §7.4): a new instance is an
# explicit, loudly detectable history reset — consistency proofs do not
# span instances.
# instance = "1"

# ── Witness cosignature aggregation (RFC-ACDP-0015 §6.1, ACDP 0.4.0) ──
#
# Independent witnesses this registry polls; their VERIFIED cosignatures
# are attached to checkpoint responses as the reserved top-level
# `witness_signatures` member, so a consumer gets a checkpoint + its
# witness quorum in one fetch and verifies N-witnessed locally.
#
# For each witness a background poller GETs <url>?log_id=<this log_id> over
# the SSRF-guarded client, verifies every cosignature against THIS
# registry's own checkpoint (dropping any cosigning a different root — a
# fork or a lie), and stores only the verified ones. The registry never
# holds a witness key, so aggregation adds convenience, not trust.
#
# Prerequisites (enforced at startup): [log] enabled, each `did` a did:web
# DID, each `url` HTTPS + non-private (SSRF policy). Empty = disabled.
#
# [[witnesses]]
# did          = "did:web:witness.example.org"
# url          = "https://witness.example.org/log/witness"
# poll_seconds = 300

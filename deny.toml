[graph]
# The Docker image builds `--no-default-features --features "${STORAGE_FEATURE}"`
# with STORAGE_FEATURE defaulting to storage-pg (docker/Dockerfile:16-27), so a
# default-features-only graph would let the entire Postgres subgraph escape the
# advisory/license gate. (REG-7)
all-features = true
no-default-features = false

[advisories]
version = 2
yanked = "warn"
ignore = [
    # rustls-pemfile 2.x is unmaintained but the upstream guidance is to
    # migrate to `rustls-pki-types`'s PemObject trait. We pull it in
    # transitively through axum-server 0.7; the dependency disappears
    # once axum-server cuts a release that drops rustls-pemfile.
    "RUSTSEC-2025-0134",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # webpki-roots ships Mozilla's CA bundle under CDLA-Permissive-2.0
    # alongside MPL-2.0. The CDLA-Permissive licenses are non-copyleft
    # data licenses (https://cdla.dev/permissive-2-0/) and are required
    # by rustls-via-aws-lc-rs's webpki-roots dependency.
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# acdp 0.2.0 (trust hardening) is consumed from git until it ships on
# crates.io — see the workspace Cargo.toml note on the `acdp` dependency.
allow-git = ["https://github.com/agentcontextdistributionprotocol/acdp-rs"]

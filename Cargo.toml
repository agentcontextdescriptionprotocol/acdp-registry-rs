[workspace]
members = [
    "crates/acdp-registry-types",
    "crates/acdp-registry-store",
    "crates/acdp-registry-pg",
    "crates/acdp-registry-sqlite",
    "crates/acdp-registry-auth",
    "crates/acdp-registry-webhook",
    "crates/acdp-registry-core",
    "crates/acdp-registry-server",
]
resolver = "2"

[workspace.package]
version       = "0.1.0"
edition       = "2021"
rust-version  = "1.86"
license       = "MIT OR Apache-2.0"
repository    = "https://github.com/agentcontextdescriptionprotocol/acdp-registry-rs"
homepage      = "https://github.com/agentcontextdescriptionprotocol/acdp-registry-rs"
readme        = "README.md"

[workspace.dependencies]
# Protocol library — reuse types, crypto, validation, DID resolution.
# Sibling repo until acdp is on crates.io.
acdp = { path = "../acdp-rs", version = "0.1.0", features = ["server", "client"] }

# HTTP
axum       = { version = "0.7", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower      = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "timeout", "util"] }

# Async
tokio = { version = "1", features = ["full"] }

# Storage
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "sqlite",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
jsonwebtoken = "9"
rand         = "0.8"
hmac         = "0.12"
sha2         = "0.10"
base64       = "0.22"
hex          = "0.4"

# Config
config  = { version = "0.14", default-features = false, features = ["toml"] }
dotenvy = "0.15"

# HTTP client (webhook + admin tooling)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# IDs / time
uuid   = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Errors / tracing
thiserror          = "1"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async traits
async-trait = "0.1"

# Misc
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
